<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="An original ASCII rose blooms in a black terminal. Inspired by @jin_22ee.">
  <title>art.py — ASCII rose</title>
  <link rel="preload" href="fonts/JetBrainsMono-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Ccircle cx='8' cy='6.2' r='3.1' fill='%23d0123a'/%3E%3Cpath d='M8 9.2v4.2' stroke='%2334e07a' stroke-width='1.3'/%3E%3C/svg%3E">
</head>
<body>
  <main class="phone" id="stage">
    <h1 class="sr">ASCII rose, an original bloom</h1>
    <div class="viewport">
      <canvas id="rose" width="480" height="640" aria-label="Animated ASCII rose blooming on a black terminal"></canvas>
      <div class="controls">
        <button type="button" id="play" aria-label="Pause animation" title="Space">pause</button>
        <button type="button" id="replay" aria-label="Replay from the start" title="R">replay</button>
      </div>
      <div class="timer">
        <span class="dot" aria-hidden="true"></span>
        <span id="time">t 00.00s</span>
      </div>
      <div class="hud">
        <p class="who">@jin_22ee · 2026</p>
        <p class="stats">
          <span>bloom <b id="bloom">0.0%</b></span>
          <span>sway <b id="sway">000.00°</b></span>
        </p>
        <p class="count">letters <b id="letters">0,000</b></p>
      </div>
    </div>
    <div class="prompt">
      <span class="cmd">$ py art.py</span>
      <span id="fps">running · 30 fps</span>
    </div>
    <div class="editor" id="editor" aria-hidden="true">
      <div class="code" id="code"></div>
    </div>
    <footer class="credit">
      inspired by
      <a href="https://www.instagram.com/reel/DfWTtzwpmL4/" target="_blank" rel="noopener noreferrer">@jin_22ee Instagram reel</a>
    </footer>
    <p class="sr" id="live" aria-live="polite"></p>
  </main>
  <noscript>This rose is drawn in the browser. Enable JavaScript, then open the page again.</noscript>
  <script src="js/main.js"></script>
</body>
</html>
