<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>I love you, Adelein</title>
  <meta property="og:title" content="I love you, Adelein">
  <meta property="og:description" content="A heart drawn from 'I love you' in twenty languages, for Adelein.">
  <meta name="description" content="A heart drawn from 'I love you' in twenty languages, for Adelein.">
  <meta name="theme-color" content="#0a0610">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #0a0610;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding:
        env(safe-area-inset-top, 0px)
        env(safe-area-inset-right, 0px)
        env(safe-area-inset-bottom, 0px)
        env(safe-area-inset-left, 0px);
    }
    #wrap {
      position: relative;
      width: 100%;
      height: 100%;
      cursor: pointer;
      background:
        radial-gradient(ellipse 70% 55% at 50% 48%, rgba(120, 20, 50, 0.3) 0%, transparent 58%),
        radial-gradient(ellipse 50% 35% at 50% 100%, rgba(80, 10, 40, 0.32) 0%, transparent 50%),
        radial-gradient(ellipse 100% 100% at 50% 0%, #1a0a18 0%, #0a0610 55%, #050308 100%);
    }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #name {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0.92);
      font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      font-weight: 600;
      font-style: italic;
      font-size: 2rem;
      letter-spacing: 0.16em;
      text-indent: 0.16em;
      color: #fff8f5;
      opacity: 0;
      pointer-events: none;
      z-index: 3;
      text-shadow:
        0 0 16px rgba(255, 80, 120, 0.65),
        0 0 36px rgba(225, 40, 90, 0.4),
        0 2px 10px rgba(0, 0, 0, 0.55);
      transition: opacity 1.15s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 1.15s cubic-bezier(0.22, 1, 0.36, 1);
      white-space: nowrap;
    }
    #name.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    #name.pulse { animation: heartbeat 1.6s ease-in-out infinite; }
    @keyframes heartbeat {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      14% { transform: translate(-50%, -50%) scale(1.05); }
      28% { transform: translate(-50%, -50%) scale(0.985); }
      42% { transform: translate(-50%, -50%) scale(1.035); }
      70% { transform: translate(-50%, -50%) scale(1); }
    }
    #hint {
      position: absolute;
      left: 0; right: 0;
      bottom: max(0.85rem, calc(env(safe-area-inset-bottom, 0px) + 0.65rem));
      text-align: center;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 180, 200, 0.4);
      opacity: 0;
      transition: opacity 0.8s ease;
      pointer-events: none;
      z-index: 3;
    }
    #hint.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="wrap" role="img" aria-label="A heart formed by I love you in twenty languages, for Adelein. Tap to replay.">
    <canvas id="c"></canvas>
    <div id="name">ADELEIN</div>
    <div id="hint">Tap to replay</div>
  </div>
  <script>
  (function () {
    var PHRASES = [
      "I love you", "Ich liebe dich", "Te amo", "Je t'aime", "Ti amo",
      "Ek is lief vir jou", "Ngiyakuthanda", "Ndiyakuthanda", "Aku cinta kamu",
      "Seni seviyorum", "Jag älskar dig", "Kocham cię", "Ik hou van jou",
      "Anh yêu em", "Я тебя люблю", "사랑해", "愛してる", "我爱你",
      "मैं तुमसे प्यार करता हूँ", "Σ' αγαπώ"
    ];
    // Compact set for outline / tight screens — still covers the 20 via cycling fill
    var OUTLINE_POOL = [
      "Te amo", "Ti amo", "사랑해", "愛してる", "我爱你", "Σ' αγαπώ",
      "Je t'aime", "I love you", "Anh yêu em", "Kocham cię",
      "Ngiyakuthanda", "Ndiyakuthanda", "Ik hou van jou", "Jag älskar dig"
    ];

    var wrap = document.getElementById("wrap");
    var canvas = document.getElementById("c");
    var ctx = canvas.getContext("2d");
    var nameEl = document.getElementById("name");
    var hint = document.getElementById("hint");

    var dpr = 1, W = 0, H = 0;
    var words = [], stars = [], layoutMeta = null;
    var animId = null, startTime = 0, phase = "idle", completeAt = 0;
    var phraseIndex = 0, outlineIndex = 0, running = false;

    var HX = 16, HY_TOP = 12.5, HY_BOT = -17;
    var H_W = 32, H_H = HY_TOP - HY_BOT;

    function viewportSize() {
      var vv = window.visualViewport;
      var w = Math.round((vv && vv.width) || window.innerWidth || document.documentElement.clientWidth);
      var h = Math.round((vv && vv.height) || window.innerHeight || document.documentElement.clientHeight);
      return { w: Math.max(1, w), h: Math.max(1, h) };
    }

    function heartXY(t) {
      return {
        x: 16 * Math.pow(Math.sin(t), 3),
        y: 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)
      };
    }

    function buildOutline(n) {
      var pts = [];
      for (var i = 0; i < n; i++) pts.push(heartXY((i / n) * Math.PI * 2));
      return pts;
    }

    function insideHeart(x, y, outline) {
      var inside = false;
      for (var i = 0, j = outline.length - 1; i < outline.length; j = i++) {
        var xi = outline[i].x, yi = outline[i].y;
        var xj = outline[j].x, yj = outline[j].y;
        if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-12) + xi))
          inside = !inside;
      }
      return inside;
    }

    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

    function nextOutline() {
      var p = OUTLINE_POOL[outlineIndex % OUTLINE_POOL.length];
      outlineIndex++;
      return p;
    }
    function nextPhrase() {
      var p = PHRASES[phraseIndex % PHRASES.length];
      phraseIndex++;
      return p;
    }

    function measure(text, size, weight) {
      ctx.font = weight + " " + size + "px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
      return ctx.measureText(text).width;
    }

    function inClearEllipse(mx, my, rx, ry) {
      var dx = mx / rx, dy = (my - 0.3) / ry;
      return dx * dx + dy * dy < 1;
    }

    function layout() {
      var vp = viewportSize();
      W = vp.w; H = vp.h;
      dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      var isNarrow = W < 560;
      var isLandscape = W > H * 1.05;
      var topPad = Math.max(10, H * 0.035);
      var botPad = Math.max(26, H * 0.065);
      var availH = H - topPad - botPad;

      // Heart ~88% of viewport width, but leave margin so word glyphs don't hit edges.
      // Effective outline target ≈ 88% W; scale accounts for typical half-word (~28–40px).
      var margin = isNarrow ? Math.max(18, W * 0.055) : Math.max(20, W * 0.04);
      var targetOuterW = W * 0.88;
      var scaleByW = (targetOuterW - margin * 0.15) / H_W;
      // Slightly smaller on narrow so half-words fit inside padding
      if (isNarrow) scaleByW *= 0.90;
      var scaleByH = (availH * (isLandscape ? 0.9 : 0.88)) / H_H;
      var scale = Math.min(scaleByW, scaleByH);

      var heartPixelW = H_W * scale;
      var heartPixelH = H_H * scale;
      var midYMath = (HY_TOP + HY_BOT) / 2;
      var visualCenterY = topPad + availH / 2;
      var cx = W / 2;
      var cy = visualCenterY + midYMath * scale;

      // Smaller, crisper type on phones
      var outlineSize = Math.max(5.2, Math.min(
        isNarrow ? 6.8 : (isLandscape ? 8.8 : 10.5),
        heartPixelW / (isNarrow ? 64 : 54)
      ));
      var fillSize = outlineSize * 0.78;

      var outlineCount = Math.round(heartPixelW / (isNarrow ? 9.5 : 9.5));
      outlineCount = Math.max(isNarrow ? 52 : 56, Math.min(isNarrow ? 70 : 90, outlineCount));

      // Wide elliptical keep-out for ADELEIN (must fully clear the name + glow)
      var clearRx = isNarrow ? 9.8 : 9.2;
      var clearRy = isNarrow ? 4.6 : 4.4;
      if (isLandscape) { clearRx = 9.0; clearRy = 4.2; }

      var nameSizePx = Math.max(20, Math.min(
        isNarrow ? 32 : 58,
        heartPixelW * (isNarrow ? 0.118 : 0.12)
      ));
      // Ensure name fits in width
      nameEl.style.fontSize = nameSizePx + "px";
      nameEl.style.letterSpacing = (isNarrow ? 0.12 : 0.16) + "em";
      nameEl.style.textIndent = (isNarrow ? 0.12 : 0.16) + "em";
      nameEl.style.left = cx + "px";
      nameEl.style.top = visualCenterY + "px";
      // Shrink name if wider than clear zone
      var nameW = nameEl.getBoundingClientRect().width;
      var maxNameW = clearRx * 2 * scale * 0.92;
      if (nameW > maxNameW && nameW > 0) {
        nameSizePx *= maxNameW / nameW;
        nameEl.style.fontSize = nameSizePx + "px";
      }

      var edgePad = Math.max(8, margin * 0.7);

      stars = [];
      for (var s = 0, sc = Math.floor((W * H) / 12000); s < sc; s++) {
        stars.push({
          x: Math.random() * W, y: Math.random() * H,
          r: Math.random() * 1.15 + 0.2,
          a: Math.random() * 0.4 + 0.1,
          tw: Math.random() * Math.PI * 2,
          sp: 0.4 + Math.random() * 1.1
        });
      }

      var outlinePoly = buildOutline(360);
      words = [];
      phraseIndex = 0;
      outlineIndex = 0;

      function toScreen(mx, my) {
        return { x: cx + mx * scale, y: cy - my * scale };
      }

      function tooClose(mx, my, minD) {
        for (var i = 0; i < words.length; i++) {
          if (Math.hypot(words[i].mx - mx, words[i].my - my) < minD) return true;
        }
        return false;
      }

      // Arc-length samples
      var N = 1000, samples = [], arc = [0];
      for (var i = 0; i < N; i++) samples.push(heartXY((i / N) * Math.PI * 2));
      for (var i = 1; i < N; i++) {
        arc.push(arc[i - 1] + Math.hypot(samples[i].x - samples[i - 1].x, samples[i].y - samples[i - 1].y));
      }
      var totalArc = arc[N - 1] + Math.hypot(samples[0].x - samples[N - 1].x, samples[0].y - samples[N - 1].y);

      var outlineWords = [];
      for (var k = 0; k < outlineCount; k++) {
        var target = (k / outlineCount) * totalArc;
        var lo = 0, hi = N - 1;
        while (lo < hi) {
          var mid = (lo + hi) >> 1;
          if (arc[mid] < target) lo = mid + 1; else hi = mid;
        }
        var p = samples[lo];
        // Pull slightly inward so glyphs sit on the silhouette, not past it
        var mx = p.x * 0.97, my = p.y * 0.97;
        if (inClearEllipse(mx, my, clearRx * 0.85, clearRy * 0.85)) continue;

        var scr = toScreen(mx, my);
        var size = outlineSize;
        var nearShoulder = Math.abs(mx) > 11;
        if (nearShoulder) size *= 0.9;
        var text = null, tw = 0;
        var shortOnly = ["Te amo", "Ti amo", "사랑해", "愛してる", "我爱你", "Σ' αγαπώ", "Je t'aime"];
        for (var attempt = 0; attempt < 12; attempt++) {
          var candidate = (nearShoulder || attempt > 2) ? shortOnly[attempt % shortOnly.length] : nextOutline();
          tw = measure(candidate, size, 600);
          if (scr.x - tw / 2 >= edgePad && scr.x + tw / 2 <= W - edgePad &&
              scr.y >= edgePad && scr.y <= H - edgePad) {
            text = candidate; break;
          }
          if (attempt === 5) size = outlineSize * 0.82;
        }
        if (!text) continue;
        if (tooClose(mx, my, isNarrow ? 1.35 : 1.15)) continue;

        var w = { text: text, mx: mx, my: my, x: scr.x, y: scr.y, size: size, weight: 600, halfW: tw / 2, kind: "outline", delay: 0 };
        words.push(w);
        outlineWords.push(w);
      }

      // Sparse interior rings only (no dense lattice on narrow)
      var fillWords = [];
      var rings = isNarrow ? [0.68] : (isLandscape ? [0.7, 0.42] : [0.72, 0.5, 0.32]);
      rings.forEach(function (fs) {
        var count = Math.max(5, Math.round(outlineCount * fs * (isNarrow ? 0.22 : 0.34)));
        for (var k = 0; k < count; k++) {
          var t = ((k + 0.35) / count) * Math.PI * 2;
          var p = heartXY(t);
          var mx = p.x * fs, my = p.y * fs;
          if (inClearEllipse(mx, my, clearRx, clearRy)) continue;
          if (tooClose(mx, my, isNarrow ? 2.6 : 2.1)) continue;
          var scr = toScreen(mx, my);
          var size = fillSize;
          var text = null, tw = 0;
          for (var attempt = 0; attempt < 8; attempt++) {
            var candidate = (attempt < 3) ? nextPhrase() : nextOutline();
            tw = measure(candidate, size, 500);
            if (scr.x - tw / 2 >= edgePad && scr.x + tw / 2 <= W - edgePad) {
              text = candidate; break;
            }
            if (attempt === 3) size *= 0.9;
          }
          if (!text) continue;
          var w = { text: text, mx: mx, my: my, x: scr.x, y: scr.y, size: size, weight: 500, halfW: tw / 2, kind: "fill", delay: 0 };
          words.push(w);
          fillWords.push(w);
        }
      });

      // Desktop-only light lattice
      if (!isNarrow && !isLandscape) {
        for (var my = HY_BOT + 2; my <= HY_TOP - 2; my += 3.0) {
          for (var mx = -HX + 2; mx <= HX - 2; mx += 3.2) {
            if (!insideHeart(mx, my, outlinePoly)) continue;
            if (inClearEllipse(mx, my, clearRx, clearRy)) continue;
            if (tooClose(mx, my, 2.3)) continue;
            var scr = toScreen(mx, my);
            var size = fillSize * 0.9;
            var candidate = nextPhrase();
            var tw = measure(candidate, size, 500);
            if (scr.x - tw / 2 < edgePad || scr.x + tw / 2 > W - edgePad) continue;
            var w = { text: candidate, mx: mx, my: my, x: scr.x, y: scr.y, size: size, weight: 500, halfW: tw / 2, kind: "fill", delay: 0 };
            words.push(w);
            fillWords.push(w);
          }
        }
      }

      fillWords.sort(function (a, b) {
        return Math.hypot(b.mx, b.my) - Math.hypot(a.mx, a.my);
      });

      var t0 = 0;
      var outlineStep = isNarrow ? 32 : 38;
      outlineWords.forEach(function (w, i) { w.delay = t0 + i * outlineStep; });
      t0 += outlineWords.length * outlineStep + 140;
      var fillStep = isNarrow ? 20 : 24;
      fillWords.forEach(function (w, i) { w.delay = t0 + i * fillStep; });

      words = outlineWords.concat(fillWords);
      layoutMeta = {
        cx: cx, cy: cy, scale: scale,
        visualCenterY: visualCenterY,
        clearRx: clearRx, clearRy: clearRy,
        duration: t0 + fillWords.length * fillStep + 450,
        edgePad: edgePad
      };
    }

    function draw(now) {
      var t = now - startTime;
      ctx.clearRect(0, 0, W, H);

      var g = ctx.createRadialGradient(W / 2, layoutMeta.visualCenterY, 0, W / 2, layoutMeta.visualCenterY, Math.min(W, H) * 0.38);
      g.addColorStop(0, "rgba(220, 40, 90, 0.13)");
      g.addColorStop(0.55, "rgba(160, 20, 70, 0.05)");
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        var tw = 0.5 + 0.5 * Math.sin(now * 0.001 * s.sp + s.tw);
        ctx.beginPath();
        ctx.fillStyle = "rgba(255, 220, 230," + (s.a * tw) + ")";
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      var beat = 1;
      if (phase === "complete") {
        var cycle = ((now - completeAt) / 1000) % 1.6;
        if (cycle < 0.14) beat = 1 + 0.028 * Math.sin((cycle / 0.14) * Math.PI);
        else if (cycle < 0.28) beat = 1 + 0.012 * Math.sin(((cycle - 0.14) / 0.14) * Math.PI);
      }

      var vx = layoutMeta.cx, vy = layoutMeta.visualCenterY;
      ctx.save();
      if (beat !== 1) {
        ctx.translate(vx, vy);
        ctx.scale(beat, beat);
        ctx.translate(-vx, -vy);
      }

      // Soft void + glow behind ADELEIN
      var glowA = phase === "complete" ? 1 : Math.min(1, t / Math.max(1, layoutMeta.duration));
      var rx = layoutMeta.clearRx * layoutMeta.scale;
      var ry = layoutMeta.clearRy * layoutMeta.scale;
      var cg = ctx.createRadialGradient(vx, vy, 0, vx, vy, Math.max(rx, ry) * 1.25);
      cg.addColorStop(0, "rgba(18, 6, 14," + (0.92 * glowA) + ")");
      cg.addColorStop(0.35, "rgba(50, 10, 28," + (0.55 * glowA) + ")");
      cg.addColorStop(0.7, "rgba(100, 20, 50," + (0.16 * glowA) + ")");
      cg.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.ellipse(vx, vy, rx * 1.15, ry * 1.25, 0, 0, Math.PI * 2);
      ctx.fill();

      for (var i = 0; i < words.length; i++) {
        var w = words[i];
        var local = t - w.delay;
        if (local < 0) continue;
        var u = Math.min(1, local / 380);
        var e = easeOutCubic(u);
        var alpha = e * (w.kind === "outline" ? 0.93 : 0.55);
        var sc = 0.62 + 0.38 * e;
        if (w.x - w.halfW * sc < 3 || w.x + w.halfW * sc > W - 3) continue;
        // Never paint over ADELEIN's keep-out (screen-space ellipse)
        var rx = layoutMeta.clearRx * layoutMeta.scale * 1.08;
        var ry = layoutMeta.clearRy * layoutMeta.scale * 1.12;
        // Reject if word center or either end of the glyph run enters the keep-out
        function inKeep(px, py) {
          var ndx = (px - vx) / rx, ndy = (py - vy) / ry;
          return ndx * ndx + ndy * ndy < 1;
        }
        if (inKeep(w.x, w.y) || inKeep(w.x - w.halfW * sc, w.y) || inKeep(w.x + w.halfW * sc, w.y)) continue;

        ctx.save();
        ctx.translate(w.x, w.y);
        ctx.scale(sc, sc);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = w.kind === "outline" ? "#ff4d6d" : "#d93658";
        ctx.shadowColor = "rgba(255, 60, 100, 0.4)";
        ctx.shadowBlur = w.kind === "outline" ? 7 : 3;
        ctx.font = w.weight + " " + w.size + "px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(w.text, 0, 0);
        ctx.restore();
      }
      ctx.restore();

      if (phase === "building" && t >= layoutMeta.duration) {
        phase = "complete";
        completeAt = now;
        nameEl.classList.add("show");
        setTimeout(function () { nameEl.classList.add("pulse"); }, 1000);
        hint.classList.add("show");
        running = false;
        document.documentElement.setAttribute("data-ready", "1");
      }
      animId = requestAnimationFrame(draw);
    }

    function play() {
      if (running) return;
      running = true;
      phase = "building";
      nameEl.classList.remove("show", "pulse");
      hint.classList.remove("show");
      document.documentElement.removeAttribute("data-ready");
      layout();
      startTime = performance.now();
      if (animId) cancelAnimationFrame(animId);
      animId = requestAnimationFrame(draw);
    }

    wrap.addEventListener("click", function () { if (!running) play(); });

    var resizeTimer;
    function onResize() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        var wasComplete = phase === "complete";
        layout();
        if (wasComplete) {
          startTime = performance.now() - layoutMeta.duration - 50;
          phase = "complete";
          nameEl.classList.add("show", "pulse");
          hint.classList.add("show");
          document.documentElement.setAttribute("data-ready", "1");
        } else if (!running && phase !== "building") {
          play();
        }
      }, 100);
    }
    window.addEventListener("resize", onResize);
    window.addEventListener("orientationchange", onResize);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", onResize);
      window.visualViewport.addEventListener("scroll", onResize);
    }

    play();
  })();
  </script>
